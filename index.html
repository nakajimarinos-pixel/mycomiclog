        const firebaseConfigStr =

        // Firebase App Check（任意）: サイトキーを設定すると自動で有効化。

            .querySelector('meta[name="firebase-app-check-site-key"]')

      const MAX_COVER_FILE_BYTES = 600 * 1024;
      const MAX_COVER_DATA_URL_LENGTH = 850000;
      const SAFE_IMAGE_DATA_URL_RE =
        /^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=\r\n]+$/i;

      const isValidImageUrl = (url) => {
        if (!url || typeof url !== "string") return false;
        const value = url.trim();
        if (!value || value.length > MAX_COVER_DATA_URL_LENGTH) return false;
        if (SAFE_IMAGE_DATA_URL_RE.test(value)) return true;
        try {
          const parsed = new URL(value, window.location.origin);
          return parsed.protocol === "https:";
        } catch (_) {
          return false;
        }
      };

      const extractInitial = (title) => {
        if (!title) return "";
        const cleanTitle = title.replace(/^[『「【（(［\[\s　]+/g, "");
        if (!cleanTitle) return "";
        let firstChar = cleanTitle.charAt(0);
        // カタカナをひらがなに変換
        if (firstChar.match(/^[ァ-ヶ]$/)) {
          firstChar = String.fromCharCode(firstChar.charCodeAt(0) - 0x60);
        }
        return firstChar;
      };

      const sanitizeString = (str, maxLength = 2000) => {
        if (!str) return "";
        return String(str)
          .replace(/\u0000/g, "")
          .substring(0, maxLength);
      };

      const isSafeFirestoreId = (value) =>
        typeof value === "string" &&
        value.length > 0 &&
        value.length <= 512 &&
        !value.includes("/") &&
        value !== "." &&
        value !== "..";

      // 端末のローカル日付を YYYY-MM-DD 形式で返す。
      // toISOString() はUTC基準のため、日本時間の深夜帯で前日になるのを防ぐ。
      const getLocalDateString = (date = new Date()) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      };

      // 所持・既読を完全に独立して扱うための共通ヘルパー
      const normalizeVolumeArray = (volumes) =>
        Array.from(
          new Set(
            (Array.isArray(volumes) ? volumes : [])
              .map(Number)
              .filter((v) => Number.isInteger(v) && v > 0),
          ),
        ).sort((a, b) => a - b);

      const getReadVolumes = (work) => {
        if (Array.isArray(work?.readVolumes)) {
          return normalizeVolumeArray(work.readVolumes);
        }
        const legacyCount = Math.max(0, Number(work?.readVolumeCount) || 0);
        return Array.from({ length: legacyCount }, (_, i) => i + 1);
      };

      const getOwnedVolumes = (work) =>
        normalizeVolumeArray(work?.ownedVolumes || []);

      const hasReadVolumes = (work) => getReadVolumes(work).length > 0;

      // 「未読本」は、実際に所持している巻のうち既読になっていない巻だけ。
      // 「読みたい」など、所持巻が1冊も登録されていない作品は対象外。
      const getUnreadOwnedVolumes = (work) => {
        // 未読本の対象は「所持している」と明示された作品だけ。
        // isOwned=false の作品や「読みたい」だけの作品は、既読でなくても未読本には入れない。
        if (work?.isOwned !== true) return [];
        const ownedVolumes = getOwnedVolumes(work);
        if (ownedVolumes.length === 0) return [];
        const readSet = new Set(getReadVolumes(work));
        return ownedVolumes.filter((v) => !readSet.has(v));

      const PurchaseModal = memo(({ work, onClose, onConfirm }) => {
        const [format, setFormat] = useState(work.bookFormat || "書籍");

        const existingVols = (work.ownedVolumes || []).map(Number);

        useEffect(() => {

        }, [existingVols, maxVol]);

        const toggleVol = (v) => {

                      type="radio"
                      name="pf"
                      value="電子"

                      onChange={(e) => setFormat(e.target.value)}

                  </label>

              </div>

              <div className="mb-6">
                <div className="flex justify-between items-end mb-2">

                  </span>

                    const isSelected = selectedVols.includes(v);
                    return (

                        key={v}
                        type="button"
                        disabled={isOwned}
                        onClick={() => toggleVol(v)}
                        className={`w-10 h-10 rounded-lg border text-sm font-bold flex items-center justify-center transition-colors ${isOwned ? "bg-slate-200 text-slate-400 border-slate-200 cursor-not-allowed" : isSelected ? "bg-emerald-500 text-white border-emerald-500 shadow-sm" : "bg-white text-secondary border-slate-200 hover:border-emerald-500 hover:text-emerald-500"}`}
                      >

      const Bookshelf = memo(
        ({
          works,
          listTab,
          onTabChange,
          onEdit,
          onDelete,
          onUpdateWork,
          genres,
          onViewDetail,
          customLists,
          onSaveLists,
          dict,
          hideTabs = false,
        }) => {
          const [sortKey, setSortKey] = useState("title");
          const [filterGenre, setFilterGenre] = useState("");
          const [filterRating, setFilterRating] = useState("");
          const [searchQuery, setSearchQuery] = useState("");
          const [filterStartDate, setFilterStartDate] = useState("");
          const [filterEndDate, setFilterEndDate] = useState("");
          const [deleteConfirmId, setDeleteConfirmId] = useState(null);
          const [purchaseWork, setPurchaseWork] = useState(null);
          const [showFilters, setShowFilters] = useState(false);
          const [cartSubTab, setCartSubTab] = useState("new");
          const [ownedFormatTab, setOwnedFormatTab] = useState("all");
          const longPressTimerRef = useRef(null);
          const longPressTriggeredRef = useRef(false);
          const longPressStartRef = useRef({ x: 0, y: 0 });

          const clearLongPressTimer = useCallback(() => {
            if (longPressTimerRef.current) {
              clearTimeout(longPressTimerRef.current);
              longPressTimerRef.current = null;
            }
          }, []);

          const handleCardTouchStart = useCallback(
            (e, workId) => {
              if (typeof window !== "undefined" && window.matchMedia("(min-width: 768px)").matches)
                return;
              const touch = e.touches?.[0];
              if (!touch) return;
              clearLongPressTimer();
              longPressTriggeredRef.current = false;
              longPressStartRef.current = {
                x: touch.clientX,
                y: touch.clientY,
              };
              longPressTimerRef.current = setTimeout(() => {
                longPressTimerRef.current = null;
                longPressTriggeredRef.current = true;
                if (navigator.vibrate) navigator.vibrate(30);
                onEdit(workId);
                setTimeout(() => {
                  longPressTriggeredRef.current = false;
                }, 700);
              }, 550);
            },
            [clearLongPressTimer, onEdit],
          );

          const handleCardTouchMove = useCallback(
            (e) => {
              const touch = e.touches?.[0];
              if (!touch || !longPressTimerRef.current) return;
              const dx = touch.clientX - longPressStartRef.current.x;
              const dy = touch.clientY - longPressStartRef.current.y;
              if (Math.hypot(dx, dy) > 12) clearLongPressTimer();
            },
            [clearLongPressTimer],
          );

          const handleCardTouchEnd = useCallback(() => {
            clearLongPressTimer();
          }, [clearLongPressTimer]);

          useEffect(
            () => () => clearLongPressTimer(),
            [clearLongPressTimer],
          );

          const [filterFlags, setFilterFlags] = useState({
            completed: false,
            readComplete: false,
            comp: false,
            missingOwned: false,
            unowned: false,
            favorite: false,
            formatBook: false,
            formatDigital: false,
          });

          const toggleFlag = (key) =>
            setFilterFlags((prev) => ({ ...prev, [key]: !prev[key] }));

          const resetFilters = () => {
            setSearchQuery("");
            setFilterGenre("");
            setFilterRating("");
            setFilterStartDate("");
            setFilterEndDate("");
            setFilterFlags({
              completed: false,
              readComplete: false,
              comp: false,
              missingOwned: false,
              unowned: false,
              favorite: false,
              formatBook: false,
              formatDigital: false,
            });
          };

          const filtered = useMemo(() => {
            let res = works;
            if (listTab === "read") res = works.filter((w) => hasReadVolumes(w));
            else if (listTab === "unread")
              res = works.filter((w) => w.isTsundoku);
            else if (listTab === "unreadOwned")
              res = works.filter((w) => hasUnreadOwnedVolumes(w));
            else if (listTab === "owned") {
              res = works.filter(
                (w) => w.isOwned || getOwnedVolumes(w).length > 0,
              );
              if (ownedFormatTab === "book")
                res = res.filter((w) => w.bookFormat === "書籍");
              else if (ownedFormatTab === "digital")
                res = res.filter((w) => w.bookFormat === "電子");
            } else if (listTab === "cart") {
              if (cartSubTab === "new") res = works.filter((w) => w.isCart);
              else if (cartSubTab === "missing")
                res = works.filter(
                  (w) =>
                    w.isOwned &&
                    w.volumeCount > 0 &&
                    (w.ownedVolumes?.length || 0) < w.volumeCount,
                );
            }

            if (filterGenre) res = res.filter((w) => w.genre === filterGenre);

            if (filterFlags.completed) res = res.filter((w) => w.isCompleted);
            if (filterFlags.readComplete)
              res = res.filter(
                (w) =>
                  w.volumeCount > 0 &&
                  getReadVolumes(w).length >= w.volumeCount,
              );
            if (filterFlags.comp)
              res = res.filter(
                (w) =>
                  w.isOwned &&
                  w.volumeCount > 0 &&
                  (w.ownedVolumes?.length || 0) >= w.volumeCount,
              );
            if (filterFlags.missingOwned)
              res = res.filter(
                (w) =>
                  w.isOwned &&
                  w.volumeCount > 0 &&
                  (w.ownedVolumes?.length || 0) < w.volumeCount,
              );
            if (filterFlags.unowned)
              res = res.filter(
                (w) =>
                  hasReadVolumes(w) && getOwnedVolumes(w).length === 0,
              );
            if (filterFlags.favorite)
              res = res.filter((w) => !!w.isFavorite);
            if (filterFlags.formatBook)
              res = res.filter((w) => w.bookFormat === "書籍");
            if (filterFlags.formatDigital)
              res = res.filter((w) => w.bookFormat === "電子");

            if (
              filterRating &&
              listTab !== "unread" &&
              listTab !== "cart"
            ) {
              const minRating = Number(filterRating);
              if (minRating === 3)
                res = res.filter((w) => (w.overallRating || 0) >= 3);
              else
                res = res.filter((w) => {
                  const r = w.overallRating || 0;
                  return r >= minRating && r < minRating + 1;
                });
            }
            if (filterStartDate)
              res = res.filter((w) => w.recordedAt >= filterStartDate);
            if (filterEndDate)
              res = res.filter((w) => w.recordedAt <= filterEndDate);
            if (searchQuery) {
              const q = searchQuery.toLowerCase();
              res = res.filter(
                (w) =>
                  w.title.toLowerCase().includes(q) ||
                  (w.author && w.author.toLowerCase().includes(q)) ||
                  (w.publisher && w.publisher.toLowerCase().includes(q)) ||
                  (w.tags && w.tags.some((t) => t.toLowerCase().includes(q))),
              );
            }
            return res.sort((a, b) => {
              if (sortKey === "recordedAt")
                return new Date(b.recordedAt) - new Date(a.recordedAt);
              if (sortKey === "overallRating")
                return (b.overallRating || 0) - (a.overallRating || 0);

              const aVal = a.initial || extractInitial(a.title) || a.title;
              const bVal = b.initial || extractInitial(b.title) || b.title;
              return aVal.localeCompare(bVal, "ja", {
                numeric: true,
                sensitivity: "base",
              });
            });
          }, [
            works,
            listTab,
            ownedFormatTab,
            sortKey,
            filterGenre,
            filterRating,
            searchQuery,
            filterStartDate,
            filterEndDate,
            filterFlags,
          ]);

          const getVolumeCount = () => {
            if (listTab === "owned")
              return filtered.reduce(
                (sum, w) => sum + (w.ownedVolumes?.length || 0),
                0,
              );
            if (listTab === "read")
              return filtered.reduce(
                (sum, w) => sum + getReadVolumes(w).length,
                0,
              );
            if (listTab === "unreadOwned")
              return filtered.reduce(
                (sum, w) => sum + getUnreadOwnedVolumes(w).length,
                0,
              );
            if (listTab === "unread")
              return filtered.reduce((sum, w) => sum + (w.volumeCount || 1), 0);
            if (listTab === "cart") {
              if (cartSubTab === "new")
                return filtered.reduce(
                  (sum, w) => sum + (w.volumeCount || 1),
                  0,
                );
              if (cartSubTab === "missing")
                return filtered.reduce(
                  (sum, w) =>
                    sum +
                    Math.max(0, w.volumeCount - (w.ownedVolumes?.length || 0)),
                  0,
                );
            }
            return 0;
          };

          const inputClass =
            "w-full p-3.5 bg-background border border-borderLight rounded-xl text-sm font-medium focus:border-accent focus:bg-white focus:ring-4 focus:ring-accent/10 outline-none transition-all";
          const tabBaseClass =
            "flex-1 basis-0 shrink-0 min-w-[70px] sm:min-w-[80px] py-2.5 px-1 sm:px-2 text-[11px] sm:text-sm font-bold rounded-lg whitespace-nowrap transition-all flex items-center justify-center gap-1";

          const titleText =
            listTab === "owned"
              ? dict.ownedShelf
              : listTab === "read"
                ? dict.bookshelf
                : listTab === "unreadOwned"
                  ? dict.unreadOwnedShelf
                  : listTab === "unread"
                    ? dict.tsundokuShelf
                    : listTab === "cart"
                      ? "カート内の作品"
                      : "本棚";

          return (
            <div className="page-transition space-y-8 pb-20">
              <PageHeader title={titleText} />
              {deleteConfirmId && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 transition-opacity">
                  <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-xl">
                    <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">

          const getSortedOptions = (opts) => {
            if (!opts) return [];
            const list = opts.filter((x) => x !== "その他");
            return [...list, "その他"];
          };

          const getDraft = () => {
            if (
              draftRef &&
              draftRef.current &&
              draftRef.current.workId === workId
            )
              return draftRef.current;
            return null;
          };
          const draft = getDraft();

          const [isTsundokuMode, setIsTsundokuMode] = useState(() =>
            draft ? draft.isTsundokuMode : initialData?.isTsundoku || false,
          );
          const catOptions = getSortedOptions(categories);
          const genOptions = getSortedOptions(genres);
          const pubOptions = getSortedOptions(publishers);

          const [formData, setFormData] = useState(() => {
            if (draft) return draft.formData;
            if (initialData)
              return {
                ...initialData,
                initial:
                  initialData.initial || extractInitial(initialData.title),
                readVolumes:
                  initialData.readVolumes ||
                  Array.from(
                    {
                      length: Math.max(
                        1,
                        Number(initialData.readVolumeCount) || 1,
                      ),
                    },
                    (_, i) => i + 1,
                  ),
                isOwned: initialData.isOwned || false,
                bookFormat: initialData.bookFormat || "書籍",
                ownedVolumes: initialData.ownedVolumes || [],
                latestReleaseDate: initialData.latestReleaseDate || "",
                latestReleaseVolume: initialData.latestReleaseVolume || "",
                isCompleted: initialData.isCompleted || false,
                memo: initialData.memo || "",

            return {
              title: "",
              initial: "",
              author: "",
              publisher: pubOptions[0] || "",
              category: catOptions[0] || "",
              genre: genOptions[0] || "",
              tags: [],
              isFavorite: false,
              volumeCount: 1,
              readVolumes: [1],
              readVolumeCount: 1,
              isOwned: false,
              bookFormat: "書籍",
              ownedVolumes: [],
              latestReleaseDate: "",
              latestReleaseVolume: "",
              isCompleted: false,
              coverImage: null,
              memo: "",
            };
          });
          const [tagInput, setTagInput] = useState(() =>
            draft ? draft.tagInput : "",
          );
          const initOverallRating =
            isEdit && !initialData?.isTsundoku
              ? Math.min(3, Math.max(0, Number(initialData.overallRating) || 0))
              : 0;
          const [overallRating, setOverallRating] = useState(() =>
            draft ? draft.overallRating : initOverallRating,
          );

          const [customCategory, setCustomCategory] = useState(() =>
            draft
              ? draft.customCategory
              : initialData?.category &&
                  !catOptions.includes(initialData.category)
                ? initialData.category
                : "",
          );
          const [customGenre, setCustomGenre] = useState(() =>
            draft
              ? draft.customGenre
              : initialData?.genre && !genOptions.includes(initialData.genre)
                ? initialData.genre
                : "",
          );
          const [customPublisher, setCustomPublisher] = useState(() =>
            draft
              ? draft.customPublisher
              : initialData?.publisher &&
                  !pubOptions.includes(initialData.publisher)
                ? initialData.publisher
                : "",
          );

          const [errors, setErrors] = useState([]);
          const [isSaving, setIsSaving] = useState(false);
          const [duplicateConfirmData, setDuplicateConfirmData] =
            useState(null);

          const displayCategory =
            !catOptions.includes(formData.category) && formData.category
              ? "その他"
              : formData.category;
          const displayGenre =
            !genOptions.includes(formData.genre) && formData.genre
              ? "その他"
              : formData.genre;
          const displayPublisher =
            !pubOptions.includes(formData.publisher) && formData.publisher
              ? "その他"
              : formData.publisher;

          useEffect(() => {
            if (draftRef) {
              draftRef.current = {
                workId,
                isTsundokuMode,
                formData,
                tagInput,
                overallRating,
                customCategory,
                customGenre,
                customPublisher,
              };
            }
          });

          const handleImageChange = (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const allowedTypes = new Set([
              "image/jpeg",
              "image/png",
              "image/webp",
            ]);
            if (!allowedTypes.has(file.type)) {
              setErrors(["表紙画像はJPEG・PNG・WebPのみ使用できます。"]);
              e.target.value = "";
              return;
            }
            if (file.size > MAX_COVER_FILE_BYTES) {
              setErrors(["表紙画像は600KB以下にしてください。"]);
              e.target.value = "";
              return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
              const result = event.target?.result;
              if (typeof result !== "string" || !isValidImageUrl(result)) {
                setErrors(["表紙画像を安全に読み込めませんでした。"]);
                return;
              }
              setErrors([]);
              setFormData((prev) => ({ ...prev, coverImage: result }));
            };
            reader.onerror = () =>
              setErrors(["表紙画像の読み込みに失敗しました。"]);
            reader.readAsDataURL(file);
          };

          const handleSave = async (force = false) => {
            const errs = [];
            if (!formData.title.trim()) errs.push("タイトルを入力してください");

            if (!formData.initial?.trim()) {
              errs.push("作品の頭文字を入力してください");
            } else if (!/^[ぁ-んゔー]+$/.test(formData.initial)) {
              errs.push("作品の頭文字はひらがなで入力してください");
            } else if (formData.initial.length !== 1) {
              errs.push("作品の頭文字は1文字で入力してください");
            }

            if (formData.coverImage && !isValidImageUrl(formData.coverImage))
              errs.push("不正な画像URLが含まれています。");
            if (
              !isTsundokuMode &&
              (formData.readVolumes || []).length > 0 &&
              overallRating === 0
            ) {
              errs.push(`総合評価を入力してください`);
            }
            if (errs.length > 0) return setErrors(errs);
            if (!force && works) {
              const duplicate = works.find(
                (w) =>
                  w.title.trim() === formData.title.trim() &&
                  w.id !== initialData?.id,
              );
              if (duplicate) {
                setDuplicateConfirmData(formData);
                return;
              }
            }
            setIsSaving(true);
            setErrors([]);
            let finalPub =
              displayPublisher === "その他" && customPublisher.trim()
                ? customPublisher.trim()
                : displayPublisher;
            let finalCat =
              displayCategory === "その他" && customCategory.trim()
                ? customCategory.trim()
                : displayCategory;
            let finalGen =
              displayGenre === "その他" && customGenre.trim()
                ? customGenre.trim()
                : displayGenre;
            if (finalPub !== displayPublisher && onAddPublisher)
              onAddPublisher(finalPub);
            if (finalCat !== displayCategory && onAddCategory)
              onAddCategory(finalCat);
            if (finalGen !== displayGenre && onAddGenre) onAddGenre(finalGen);

            try {
              let saveData = {};
              const baseData = {
                ...formData,
                title: sanitizeString(formData.title, 500),
                initial: sanitizeString(
                  formData.initial || extractInitial(formData.title),
                  10,
                ),
                author: sanitizeString(formData.author, 200),
                favoriteCharacter: "",
                publisher: sanitizeString(finalPub, 100),
                category: sanitizeString(finalCat, 50),
                genre: sanitizeString(finalGen, 50),
                tags: formData.tags
                  .map((t) => sanitizeString(t, 50))
                  .slice(0, 20),
                memo: sanitizeString(formData.memo, 2000),
                // 登録日は入力欄を持たず、新規登録時に自動設定。編集時は元の登録日を維持する。
                recordedAt: isEdit
                  ? initialData?.recordedAt || getLocalDateString()
                  : getLocalDateString(),
                isOwned: !!formData.isOwned,
                bookFormat: formData.isOwned
                  ? formData.bookFormat || "書籍"
                  : "",
                ownedVolumes: formData.isOwned
                  ? normalizeVolumeArray(formData.ownedVolumes || [])
                  : [],
                isFavorite: !!formData.isFavorite,
                latestReleaseDate: formData.latestReleaseDate || "",
                latestReleaseVolume: formData.latestReleaseVolume || "",
                isCompleted: !!formData.isCompleted,
                volumeCount: Math.max(1, Number(formData.volumeCount) || 1),
              };
              if (isTsundokuMode) {
                saveData = {
                  ...baseData,
                  isTsundoku: true,
                  wantToReadRating: 0,
                  readVolumes: [],
                  readVolumeCount: 0,
                  overallRating: 0,
                };
              } else {
                saveData = {
                  ...baseData,
                  isTsundoku: false,
                  wantToReadRating: 0,
                  readVolumeCount: formData.readVolumes.length,
                  overallRating: Math.min(3, Math.max(0, overallRating)),
                };
              }
              await onSave(saveData);
              if (draftRef) draftRef.current = null;

              if (isEdit) {
                onCancel();
              } else {
                setFormData({
                  title: "",
                  initial: "",
                  author: "",
                    publisher: pubOptions[0] || "",
                  category: catOptions[0] || "",
                  genre: genOptions[0] || "",
                  tags: [],
                  isFavorite: false,
                  volumeCount: 1,
                  readVolumes: [1],
                  readVolumeCount: 1,
                  isOwned: false,
                  bookFormat: "書籍",
                  ownedVolumes: [],
                  latestReleaseDate: "",
                  latestReleaseVolume: "",
                  isCompleted: false,
                  coverImage: null,
                  memo: "",
                });
                setCustomCategory("");
                setCustomGenre("");
                setCustomPublisher("");
                setTagInput("");
                setOverallRating(0);
                window.scrollTo({ top: 0, left: 0, behavior: "instant" });
              }
            } catch (e) {
              setErrors(["保存中にエラーが発生しました。"]);
            } finally {
              setIsSaving(false);
            }
          };

          const inputClass =
            "w-full p-3.5 bg-background border border-borderLight rounded-xl outline-none focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 transition-all text-sm font-medium text-primary";
          const labelClass = "block text-xs font-semibold text-secondary mb-2";

          return (
            <div className="page-transition pb-20 max-w-2xl mx-auto space-y-6 md:space-y-8">
              <PageHeader
                title={isEdit ? "登録情報の編集" : "作品登録"}
              />


              {errors.length > 0 && (
                <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-medium border border-red-100">
                  <ul>
                    {errors.map((e, i) => (
                      <li key={i} className="mb-1 flex items-center gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>
                        {e}
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              <div className="space-y-6">
                <section className="bg-surface p-6 md:p-8 rounded-3xl shadow-soft border border-borderLight space-y-6">
                  <h3 className="text-lg font-bold text-primary flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-accentLight text-accent flex items-center justify-center text-xs font-en shrink-0">
                      1
                    </span>
                    基本情報
                  </h3>
                  <div className="space-y-5">
                    <div>
                      <label className={labelClass}>
                        タイトル <span className="text-accent ml-1">*</span>
                      </label>
                      <input
                        type="text"
                        className={`${inputClass} text-base font-bold mt-1`}
                        value={formData.title}
                        onChange={(e) =>
                          setFormData({ ...formData, title: e.target.value })
                        }
                        placeholder="作品タイトルを入力"
                      />
                    </div>
                    <div>
                      <label className={labelClass}>
                        作品の頭文字 <span className="text-accent ml-1">*</span>
                      </label>
                      <input
                        type="text"
                        className={`${inputClass} text-base font-bold mt-1`}
                        value={formData.initial || ""}
                        onChange={(e) => {
                          let val = e.target.value;
                          // 入力されたカタカナを自動的にひらがなに変換
                          val = val.replace(/[ァ-ヶ]/g, function (match) {
                            return String.fromCharCode(
                              match.charCodeAt(0) - 0x60,
                            );
                          });
                          // ひらがな以外を削除し、1文字に制限
                          val = val
                            .replace(/[^ぁ-んゔー]/g, "")
                            .substring(0, 1);
                          setFormData({ ...formData, initial: val });
                        }}
                        placeholder="例: あ"
                        maxLength="1"
                      />
                      <p className="text-[10px] text-secondary mt-1">
                        ※タイトル順に正確に並べるため、作品のフリガナの最初の文字（ひらがな1文字）を入力してください。
                      </p>
                    </div>
                    <div className="pt-2">
                      <label className={labelClass}>表紙画像</label>
                      <div className="flex items-center gap-5">
                        <div className="w-24 h-32 bg-slate-50 border border-borderLight rounded-xl flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
                          {formData.coverImage &&
                          isValidImageUrl(formData.coverImage) ? (
                            <img
                              referrerPolicy="no-referrer"
                              decoding="async"
                              loading="lazy"
                              loading="lazy"
                              src={formData.coverImage}
                              className="w-full h-full object-cover"
                            />
                          ) : (
                            <div className="text-slate-300">
                              <Icons.Image className="w-6 h-6 shrink-0" />
                            </div>
                          )}
                        </div>
                        <div className="flex-1 space-y-3">
                          <label className="block w-full text-center py-3 cursor-pointer btn-outline text-sm">
                            画像を選択
                            <input
                              type="file"
                              accept="image/*"
                              onChange={handleImageChange}
                              className="hidden"
                            />
                          </label>
                          {formData.coverImage && (
                            <button
                              type="button"
                              onClick={() =>
                                setFormData({ ...formData, coverImage: null })
                              }
                              className="w-full text-center py-3 text-xs font-medium text-red-500 hover:bg-red-50 rounded-xl transition-colors"
                            >
                              削除する
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className={labelClass}>作者</label>
                        <input
                          type="text"
                          className={inputClass}
                          value={formData.author || ""}
                          onChange={(e) =>
                            setFormData({ ...formData, author: e.target.value })
                          }
                          placeholder="作者名を入力"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className={labelClass}>{dict.publisher}</label>
                        <select
                          className={inputClass}
                          value={displayPublisher}
                          onChange={(e) => {
                            setFormData({
                              ...formData,
                              publisher: e.target.value,
                            });
                            if (e.target.value !== "その他")
                              setCustomPublisher("");
                          }}
                        >
                          {pubOptions.map((p) => (
                            <option key={p} value={p}>
                              {p}
                            </option>
                          ))}
                        </select>
                        {displayPublisher === "その他" && (
                          <input
                            type="text"
                            className={`${inputClass} mt-2 bg-slate-50`}
                            value={customPublisher}
                            onChange={(e) => setCustomPublisher(e.target.value)}
                            placeholder={`新しい${dict.publisher}を入力（任意）`}
                          />
                        )}
                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className={labelClass}>カテゴリー</label>
                        <select
                          className={inputClass}
                          value={displayCategory}
                          onChange={(e) => {
                            setFormData({
                              ...formData,
                              category: e.target.value,
                            });
                            if (e.target.value !== "その他")
                              setCustomCategory("");
                          }}
                        >
                          {catOptions.map((c) => (
                            <option key={c} value={c}>
                              {c}
                            </option>
                          ))}
                        </select>
                        {displayCategory === "その他" && (
                          <input
                            type="text"
                            className={`${inputClass} mt-2 bg-slate-50`}
                            value={customCategory}
                            onChange={(e) => setCustomCategory(e.target.value)}
                            placeholder="新しいカテゴリーを入力（任意）"
                          />
                        )}
                      </div>
                      <div>
                        <label className={labelClass}>ジャンル</label>
                        <select
                          className={inputClass}
                          value={displayGenre}
                          onChange={(e) => {
                            setFormData({ ...formData, genre: e.target.value });
                            if (e.target.value !== "その他") setCustomGenre("");
                          }}
                        >
                          {genOptions.map((g) => (
                            <option key={g} value={g}>
                              {g}
                            </option>
                          ))}
                        </select>
                        {displayGenre === "その他" && (
                          <input
                            type="text"
                            className={`${inputClass} mt-2 bg-slate-50`}
                            value={customGenre}
                            onChange={(e) => setCustomGenre(e.target.value)}
                            placeholder="新しいジャンルを入力（任意）"
                          />
                        )}
                      </div>
                    </div>
                    {formData.latestReleaseDate && (
                      <div className="bg-blue-50 border border-blue-100 rounded-xl px-4 py-3 text-sm font-medium text-blue-900">
                        最新刊
                        {formData.latestReleaseVolume
                          ? ` 第${formData.latestReleaseVolume}${dict.volume}`
                          : ""}
                        ：{formData.latestReleaseDate.replace(/-/g, "/")}
                        {formData.isCompleted && (
                          <span className="ml-2 text-xs font-bold text-rose-600">完結</span>
                        )}
                      </div>
                    )}

                    <div
                      className={`grid grid-cols-1 ${!isTsundokuMode ? "gap-5" : ""}`}
                    >
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-2">
                        <div>
                          <label className={labelClass}>
                            {isTsundokuMode
                              ? dict.plannedVolumes
                              : dict.totalVolumes}
                          </label>
                          <div className="flex gap-3 items-center">
                            <input
                              type="number"
                              className={`${inputClass} flex-1`}
                              value={
                                formData.volumeCount === ""
                                  ? ""
                                  : formData.volumeCount
                              }
                              onChange={(e) => {
                                const val = e.target.value;
                                if (val === "") {
                                  setFormData({ ...formData, volumeCount: "" });
                                } else {
                                  const v = parseInt(val, 10);
                                  if (!isNaN(v)) {
                                    setFormData({
                                      ...formData,
                                      volumeCount: v,
                                      readVolumes: (
                                        formData.readVolumes || []
                                      ).filter((vol) => vol <= v),
                                      ownedVolumes: (
                                        formData.ownedVolumes || []
                                      ).filter((vol) => vol <= v),
                                    });
                                  }
                                }
                              }}
                              min="1"
                            />
                            <label className="flex items-center gap-2 cursor-pointer p-3.5 border border-rose-200 rounded-xl bg-rose-50 hover:bg-rose-100 transition-colors shrink-0 whitespace-nowrap">
                              <input
                                type="checkbox"
                                className="w-5 h-5 accent-rose-500 rounded"
                                checked={formData.isCompleted}
                                onChange={(e) =>
                                  setFormData({
                                    ...formData,
                                    isCompleted: e.target.checked,
                                  })
                                }
                              />
                              <span className="text-sm font-bold text-rose-900">
                                完結済み
                              </span>
                            </label>
                          </div>
                        </div>
                      </div>

                      <div className="pt-4 border-t border-slate-50 mt-2">
                        <div className="flex flex-col sm:flex-row gap-4 mb-4">
                          <label className="flex-1 flex items-center gap-2 cursor-pointer p-4 border border-borderLight rounded-xl bg-slate-50 hover:bg-slate-100 transition-colors">
                            <input
                              type="checkbox"
                              className="w-5 h-5 accent-emerald-500"
                              checked={formData.isOwned}
                              onChange={(e) => {
                                const checked = e.target.checked;
                                setFormData((prev) => ({
                                  ...prev,
                                  isOwned: checked,
                                  ownedVolumes: checked
                                    ? prev.ownedVolumes || []
                                    : [],
                                }));
                                if (checked) setIsTsundokuMode(false);
                              }}
                            />
                            <span className="text-sm font-bold text-primary">
                              本棚に登録する
                            </span>
                          </label>
                          <label className="flex-1 flex items-center gap-2 cursor-pointer p-4 border border-amber-200 rounded-xl bg-amber-50 hover:bg-amber-100 transition-colors shadow-sm">
                            <input
                              type="checkbox"
                              className="w-5 h-5 accent-amber-500 rounded"
                              checked={isTsundokuMode}
                              onChange={(e) => {
                                const checked = e.target.checked;
                                setIsTsundokuMode(checked);
                                if (checked)
                                  setFormData({ ...formData, isOwned: false });
                              }}
                            />
                            <span className="text-sm font-bold text-amber-900">
                              「{dict.tsundoku}」として登録
                            </span>
                          </label>
                        </div>

                        {formData.isOwned && (
                          <div className="mb-4 animation-fadeIn">
                            <div className="flex gap-4 mb-4 p-4 border border-borderLight rounded-xl bg-white">
                              <label className="flex items-center gap-2 cursor-pointer">
                                <input
                                  type="radio"
                                  name="bookFormat"
                                  value="書籍"
                                  checked={
                                    formData.bookFormat === "書籍" ||
                                    !formData.bookFormat
                                  }
                                  onChange={(e) =>
                                    setFormData({
                                      ...formData,
                                      bookFormat: e.target.value,
                                    })
                                  }
                                  className="accent-emerald-500 w-4 h-4"
                                />
                                <span className="text-sm font-bold text-primary">
                                  書籍
                                </span>
                              </label>
                              <label className="flex items-center gap-2 cursor-pointer">
                                <input
                                  type="radio"
                                  name="bookFormat"
                                  value="電子"
                                  checked={formData.bookFormat === "電子"}
                                  onChange={(e) =>
                                    setFormData({
                                      ...formData,
                                      bookFormat: e.target.value,
                                    })
                                  }
                                  className="accent-emerald-500 w-4 h-4"
                                />
                                <span className="text-sm font-bold text-primary">
                                  電子
                                </span>
                              </label>
                            </div>
                            <div className="flex justify-between items-end mb-2">
                              <label className={`${labelClass} mb-0`}>
                                {dict.ownedVolumesLabel}{" "}
                                <span className="text-secondary font-normal ml-1 whitespace-nowrap">
                                  ※ダブルクリックで一括選択
                                </span>
                              </label>
                              <div className="flex gap-3">
                                <button
                                  type="button"
                                  onClick={() => {
                                    const vols = Array.from(
                                      {
                                        length: Math.max(
                                          1,
                                          Number(formData.volumeCount),
                                        ),
                                      },
                                      (_, i) => i + 1,
                                    );
                                    setFormData({
                                      ...formData,
                                      ownedVolumes: vols,
                                    });
                                  }}
                                  className="text-[10px] text-emerald-600 font-bold hover:underline whitespace-nowrap"
                                >
                                  すべて選択
                                </button>
                                <button
                                  type="button"
                                  onClick={() =>
                                    setFormData({
                                      ...formData,
                                      ownedVolumes: [],
                                    })
                                  }
                                  className="text-[10px] text-secondary font-bold hover:underline whitespace-nowrap"
                                >
                                  クリア
                                </button>
                              </div>
                            </div>
                            <div className="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-3 border border-borderLight rounded-xl bg-slate-50">
                              {Array.from(
                                {
                                  length: Math.max(
                                    1,
                                    Number(formData.volumeCount),
                                  ),
                                },
                                (_, i) => i + 1,
                              ).map((v) => (
                                <label
                                  key={`owned-${v}`}
                                  onDoubleClick={() => {
                                    const vols = Array.from(
                                      { length: v },
                                      (_, i) => i + 1,
                                    );
                                    setFormData({
                                      ...formData,
                                      ownedVolumes: vols,
                                    });
                                  }}
                                  className={`flex items-center justify-center w-10 h-10 rounded-lg border text-sm font-bold cursor-pointer transition-colors select-none ${(formData.ownedVolumes || []).includes(v) ? "bg-emerald-500 text-white border-emerald-500 shadow-sm" : "bg-white text-secondary border-slate-200 hover:border-emerald-500 hover:text-emerald-500"}`}
                                >
                                  <input
                                    type="checkbox"
                                    className="hidden"
                                    checked={(
                                      formData.ownedVolumes || []
                                    ).includes(v)}
                                    onChange={(e) => {
                                      const newVols = e.target.checked
                                        ? [
                                            ...(formData.ownedVolumes || []),
                                            v,
                                          ].sort((a, b) => a - b)
                                        : (formData.ownedVolumes || []).filter(
                                            (x) => x !== v,
                                          );
                                      setFormData({
                                        ...formData,
                                        ownedVolumes: newVols,
                                      });
                                    }}
                                  />
                                  {v}
                                </label>

                    <div className="text-right shrink-0 bg-background px-3 py-1.5 rounded-xl border border-borderLight group-hover:bg-white group-hover:border-accent/30 transition-colors">
                      <p className="font-en font-bold text-lg text-primary flex items-center justify-end gap-1">
                        <Icons.Star
