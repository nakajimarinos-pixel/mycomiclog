      const RankingPortal = memo(({ works, dict, onViewDetail }) => {
        const readWorks = works.filter((w) => hasReadVolumes(w));
        return (
          <div className="space-y-8 pb-20 page-transition">
            <PageHeader title="総合ランキング" />
            <div className="bg-surface p-6 md:p-8 rounded-3xl shadow-soft border border-borderLight">
              <RankingList
                works={readWorks}
                dict={dict}
                onViewDetail={onViewDetail}
              />
            </div>
          </div>
        );
      });

      const SettingsPortal = memo(
        ({
          works,
          categories,
          setCategories,
          genres,
          setGenres,
          publishers,
          setPublishers,
          resetAll,
          onLogout,
          dict,
        }) => {
          const [nc, setNc] = useState("");
          const [ng, setNg] = useState("");
          const [np, setNp] = useState("");
          const [showResetModal, setShowResetModal] = useState(false);

          const escapeCSV = (str) => {
            if (str === null || str === undefined) return '""';
            let escaped = String(str).replace(/"/g, '""');
            if (/^[=+\-@]/.test(escaped)) escaped = "'" + escaped;
            return `"${escaped}"`;
          };
          const exportToCSV = () => {
            const headers = [
              "タイトル",
              "作者",
              dict.publisher,
              "カテゴリー",
              "ジャンル",
              "記録日",
              "状態",
              "所持/総巻数",
              dict.readVolumes,
              "総合評価",
              "お気に入り",
              "所持している",
              "形式",
              "メモ",
            ];
            const rows = works.map((w) => {
              const readCount = getReadVolumes(w).length;
              const status = w.isTsundoku
                ? dict.tsundoku
                : readCount > 0
                  ? "既読あり"
                  : getUnreadOwnedVolumes(w).length > 0
                    ? "未読"
                    : "未読";
              return [
                escapeCSV(w.title),
                escapeCSV(w.author || ""),
                escapeCSV(w.publisher || ""),
                escapeCSV(w.category || ""),
                escapeCSV(w.genre || ""),
                escapeCSV(w.recordedAt),
                escapeCSV(status),
                escapeCSV(w.volumeCount || 1),
                escapeCSV(readCount),
                escapeCSV(w.overallRating ? w.overallRating.toFixed(1) : ""),
                escapeCSV(w.isFavorite ? "はい" : "いいえ"),
                escapeCSV(w.isOwned ? "はい" : "いいえ"),
                escapeCSV(w.bookFormat || ""),
                escapeCSV(w.memo || ""),
              ].join(",");
            });
            const blob = new Blob(
              ["\uFEFF" + [headers.join(","), ...rows].join("\n")],
              { type: "text/csv;charset=utf-8;" },
            );
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute(
              "download",
              `comilog_export_${new Date().toISOString().split("T")[0]}.csv`,
            );
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const DraggableList = ({ items, setItems }) => {
            const [draggedIdx, setDraggedIdx] = useState(null);
            const handleDragStart = (e, index) => {
              setDraggedIdx(index);
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", index);
            };
            const handleDrop = (e, index) => {
              e.preventDefault();
              if (draggedIdx === null || draggedIdx === index) return;
              const displayItems = items.filter((x) => x !== "その他");
              const newItems = [...displayItems];
              const [moved] = newItems.splice(draggedIdx, 1);
              newItems.splice(index, 0, moved);
              setItems([...newItems, "その他"]);
              setDraggedIdx(null);
            };
            const displayItems = items.filter((x) => x !== "その他");
            return (
              <div className="flex flex-wrap gap-2 pt-1">
                {displayItems.map((item, index) => (
                  <span
                    key={item}
                    draggable
                    onDragStart={(e) => handleDragStart(e, index)}
                    onDragOver={(e) => {
                      e.preventDefault();
                      e.dataTransfer.dropEffect = "move";
                    }}
                    onDrop={(e) => handleDrop(e, index)}
                    onDragEnd={() => setDraggedIdx(null)}
                    className={`bg-slate-50 border border-slate-200 pl-2 pr-3 py-1.5 rounded-lg text-xs font-medium text-secondary flex items-center cursor-move transition-opacity shadow-sm ${draggedIdx === index ? "opacity-30" : "opacity-100 hover:border-accent hover:text-primary"}`}
                  >
                    <Icons.DragHandle className="mr-1.5 w-3.5 h-3.5 text-slate-400 shrink-0" />
                    {item}
                    <button
                      onClick={() =>
                        setItems([
                          ...displayItems.filter((x) => x !== item),
                          "その他",
                        ])
                      }
                      className="ml-2 w-4 h-4 rounded-full bg-white border border-slate-200 flex items-center justify-center hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-colors cursor-pointer shrink-0"
                    >
                      &times;
                    </button>
                  </span>
                ))}
              </div>
            );
          };
          const inputClass =
            "flex-1 p-3.5 bg-background border border-borderLight rounded-xl text-sm font-medium outline-none focus:bg-white focus:border-accent focus:ring-4 focus:ring-accent/10 transition-all";

          return (
            <div className="space-y-8 pb-20 max-w-3xl mx-auto">
              <PageHeader title="システム設定" />
              {showResetModal && (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4 transition-opacity">
                  <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-xl">
                    <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                      <Icons.Trash className="w-6 h-6 shrink-0" />
                    </div>
                    <h3 className="text-lg font-bold text-primary mb-2">
                      全データの初期化
                    </h3>
                    <p className="text-sm font-medium text-secondary mb-8 leading-relaxed">
                      クラウド上のすべてのデータを削除し、初期状態に戻します。
                      <br />
                      本当によろしいですか？
                    </p>
                    <div className="flex gap-3">
                      <button
                        onClick={() => setShowResetModal(false)}
                        className="flex-1 py-3.5 btn-outline text-sm"
                      >
                        キャンセル
                      </button>
                      <button
                        onClick={() => {
                          resetAll();
                          setShowResetModal(false);
                        }}
                        className="flex-1 py-3.5 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 transition-colors shadow-sm text-sm"
                      >
                        リセット
                      </button>
                    </div>
                  </div>
                </div>
              )}
              <section className="bg-surface rounded-3xl shadow-soft border border-borderLight p-6 md:p-8">
                <h3 className="text-lg font-bold text-primary border-b border-borderLight pb-4 mb-6 flex items-center gap-2">
                  <Icons.Settings className="w-5 h-5 shrink-0" /> アカウント管理
                </h3>
                <div className="space-y-4 pt-2">
                  <button
                    onClick={onLogout}
                    className="w-full flex items-center justify-center gap-2 p-4 text-primary bg-background border border-borderLight rounded-xl font-semibold text-sm hover:bg-slate-100 transition-colors"
                  >
                    ログアウト
                  </button>
                </div>
              </section>
              <section className="bg-surface rounded-3xl shadow-soft border border-borderLight p-6 md:p-8">
                <h3 className="text-lg font-bold text-primary border-b border-borderLight pb-4 mb-6 flex items-center gap-2">
                  <Icons.Analytics className="w-5 h-5 shrink-0" /> データ管理
                </h3>
                <div className="space-y-4 pt-2">
                  <button
                    onClick={exportToCSV}
                    className="hidden md:flex w-full items-center justify-center gap-2 p-4 text-primary bg-white border border-borderLight rounded-xl font-semibold text-sm hover:bg-slate-50 transition-colors shadow-sm"
                  >
                    <Icons.Download className="w-4 h-4 shrink-0" />{" "}
                    登録データをCSVでエクスポート (PC限定)
                  </button>
                  <button
                    onClick={() => setShowResetModal(true)}
                    className="w-full flex items-center justify-center gap-2 p-4 text-red-600 bg-red-50 border border-red-100 rounded-xl font-semibold text-sm hover:bg-red-100 transition-colors"
                  >
                    <Icons.Reset className="w-4 h-4 shrink-0" />{" "}
                    全データを初期化 (元には戻せません)
                  </button>
                </div>
              </section>
              <section className="bg-surface rounded-3xl shadow-soft border border-borderLight p-6 md:p-8">
                <h3 className="text-lg font-bold text-primary border-b border-borderLight pb-4 mb-6">
                  項目カスタマイズ
                </h3>
                <div className="space-y-5">
                  <h4 className="text-sm font-bold text-primary flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>{" "}
                    カテゴリー
                  </h4>
                  <div className="flex gap-3">
                    <input
                      type="text"
                      className={inputClass}
                      placeholder="新しいカテゴリー"
                      value={nc}
                      onChange={(e) => setNc(e.target.value)}
                    />
                    <button
                      onClick={() => {
                        if (
                          nc.trim() &&
                          nc.trim() !== "その他" &&
                          !categories.includes(nc.trim())
                        ) {
                          setCategories([
                            ...categories.filter((c) => c !== "その他"),
                            nc.trim(),
                            "その他",
                          ]);
                          setNc("");
                        } else {
                          setNc("");
                        }
                      }}
                      className="btn-solid px-6 py-3.5 text-sm whitespace-nowrap"
                    >
                      追加
                    </button>
                  </div>
                  <DraggableList items={categories} setItems={setCategories} />
                </div>
                <div className="space-y-5 pt-8 mt-8 border-t border-borderLight">
                  <h4 className="text-sm font-bold text-primary flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-accent shrink-0"></span>{" "}
                    ジャンル
                  </h4>
                  <div className="flex gap-3">
                    <input
                      type="text"
                      className={inputClass}
                      placeholder="新しいジャンル"
                      value={ng}
                      onChange={(e) => setNg(e.target.value)}
                    />
                    <button
                      onClick={() => {
                        if (
                          ng.trim() &&
                          ng.trim() !== "その他" &&
                          !genres.includes(ng.trim())
                        ) {
                          setGenres([
                            ...genres.filter((g) => g !== "その他"),
                            ng.trim(),
                            "その他",
                          ]);
                          setNg("");
                        } else {
                          setNg("");
                        }
                      }}
                      className="btn-solid px-6 py-3.5 text-sm whitespace-nowrap"
                    >
                      追加
                    </button>
                  </div>
                  <DraggableList items={genres} setItems={setGenres} />
                </div>
                <div className="space-y-5 pt-8 mt-8 border-t border-borderLight">
                  <h4 className="text-sm font-bold text-primary flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-slate-400 shrink-0"></span>{" "}
                    {dict.publisher}
                  </h4>
                  <div className="flex gap-3">
                    <input
                      type="text"
                      className={inputClass}
                      placeholder={`新しい${dict.publisher}`}
                      value={np}
                      onChange={(e) => setNp(e.target.value)}
                    />
                    <button
                      onClick={() => {
                        if (
                          np.trim() &&
                          np.trim() !== "その他" &&
                          !publishers.includes(np.trim())
                        ) {
                          setPublishers([
                            ...publishers.filter((p) => p !== "その他"),
                            np.trim(),
                            "その他",
                          ]);
                          setNp("");
                        } else {
                          setNp("");
                        }
                      }}
                      className="btn-solid px-6 py-3.5 text-sm whitespace-nowrap"
                    >
                      追加
                    </button>
                  </div>
                  <DraggableList items={publishers} setItems={setPublishers} />
                </div>
              </section>
            </div>
          );
        },
      );

      const App = () => {
        const [isFirebaseLoaded, setIsFirebaseLoaded] = useState(false);
        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [authError, setAuthError] = useState("");

        const dict = useMemo(
          () => ({
            appName: "コミログ",
            readCount: "読んだ作品数",
            tsundokuCount: "読みたい本",
            readUnit: "冊",
            readAction: "読書",
            publisher: "出版社",
            tsundoku: "読みたい",
            bookshelf: "既読",
            tsundokuShelf: "読みたい",
            ownedShelf: "本棚",
            unreadOwnedShelf: "未読本",
            readRecord: "読書・診断記録",
            volume: "巻",
            totalVolumes: "総巻数",
            plannedVolumes: "所持/予定巻数",
            readVolumes: "既読数",
            readVolumesLabel: "既読",
            ownedVolumesLabel: "本棚",
            readAndDiagnose: "読んで診断を記録する",
            readWorks: "読んだ作品",
            futureTarget: "読む本",
          }),
          [],
        );

        const [works, setWorks] = useState([]);
        const [categories, setCategories] = useState(INITIAL_CATEGORIES);
        const [genres, setGenres] = useState(INITIAL_GENRES);
        const [publishers, setPublishers] = useState(INITIAL_PUBLISHERS);
        const [customLists, setCustomLists] = useState([]);

        const [currentTab, setCurrentTab] = useState("dashboard");
        const [bookshelfTab, setBookshelfTab] = useState("owned");
        const [editingWorkId, setEditingWorkId] = useState(null);
        const [selectedWorkId, setSelectedWorkId] = useState(null);
        const [previousTab, setPreviousTab] = useState("dashboard");
        const workFormDraftRef = useRef(null);

        const scrollPositions = useRef({});

        const handleTabChange = useCallback(
          (newTab) => {
            scrollPositions.current[currentTab] = window.scrollY;
            if (newTab === "detail" || newTab === "register") {
              window.scrollTo({ top: 0, left: 0, behavior: "instant" });
            } else {
              const savedY = scrollPositions.current[newTab] || 0;
              setTimeout(() => {
                window.scrollTo({ top: savedY, left: 0, behavior: "instant" });
              }, 0);
            }
            setCurrentTab(newTab);
          },
          [currentTab],
        );

        useEffect(() => {
          const markReady = () => setIsFirebaseLoaded(true);
          if (window.FirebaseApp || window.FirebaseLoadError) {
            markReady();
            return;
          }
          window.addEventListener("firebase-bootstrap-complete", markReady, {
            once: true,
          });
          const timeout = setTimeout(markReady, 15000);
          return () => {
            window.removeEventListener("firebase-bootstrap-complete", markReady);
            clearTimeout(timeout);
          };
        }, []);

        useEffect(() => {
          if (!isFirebaseLoaded) return;
          if (!window.isFirebaseInitialized || !window.FirebaseApp) {
            setAuthLoading(false);
            return;
          }
          const auth = window.FirebaseApp.getAuth();
          const initAuth = async () => {
            try {
              if (
                typeof __initial_auth_token !== "undefined" &&
                __initial_auth_token
              )
                await window.FirebaseApp.signInWithCustomToken(
                  auth,
                  __initial_auth_token,
                );
            } catch (e) {
              console.error(e);
            } finally {
              setAuthLoading(false);
            }
          };
          initAuth();
          return window.FirebaseApp.onAuthStateChanged(auth, (u) => {
            setUser(u);
            setAuthLoading(false);
          });
        }, [isFirebaseLoaded]);

        useEffect(() => {
          if (!user || !window.isFirebaseInitialized) return;
          setWorks([]);
          const db = window.FirebaseApp.getFirestore();
          const appId =
            typeof __app_id !== "undefined" ? __app_id : "default-app-id";
          const unsubSettings = window.FirebaseApp.onSnapshot(
            window.FirebaseApp.doc(
              db,
              "artifacts",
              appId,
              "users",
              user.uid,
              "settings",
              "prefs",
            ),
            (d) => {
              if (d.exists()) {
                const data = d.data();
                if (data.categories) setCategories(data.categories);
                if (data.genres) setGenres(data.genres);
                if (data.publishers) setPublishers(data.publishers);
                if (data.customLists) setCustomLists(data.customLists);
              }
            },
          );
          const unsubWorks = window.FirebaseApp.onSnapshot(
            window.FirebaseApp.collection(
              db,
              "artifacts",
              appId,
              "users",
              user.uid,
              "works",
            ),
            (snapshot) => {
              const newWorks = [];
              snapshot.forEach((doc) => {
                const data = doc.data();
                newWorks.push({
                  id: doc.id,
                  ...data,
                  overallRating: Math.min(
                    3,
                    Math.max(0, Number(data.overallRating) || 0),
                  ),
                  isFavorite: !!data.isFavorite,
                });
              });
              setWorks(newWorks);
            },
          );
          return () => {
            unsubSettings();
            unsubWorks();
          };
        }, [user, isFirebaseLoaded]);

        const requireAuthenticatedUser = () => {
          if (!user?.uid) throw new Error("AUTH_REQUIRED");
          return user.uid;
        };

        const handleSaveWork = async (data) => {
          const uid = requireAuthenticatedUser();
          const normalizedData = {
            ...data,
            ...((data.isOwned || (data.ownedVolumes || []).length > 0)
              ? { isCart: false }
              : {}),
          };
          const db = window.FirebaseApp.getFirestore();
          const appId =
            typeof __app_id !== "undefined" ? __app_id : "default-app-id";
          if (editingWorkId) {
            if (!isSafeFirestoreId(editingWorkId)) throw new Error("INVALID_WORK_ID");
            await window.FirebaseApp.updateDoc(
              window.FirebaseApp.doc(
                db,
                "artifacts",
                appId,
                "users",
                uid,
                "works",
                editingWorkId,
              ),
              normalizedData,
            );
          } else {
            await window.FirebaseApp.addDoc(
              window.FirebaseApp.collection(
                db,
                "artifacts",
                appId,
                "users",
                uid,
                "works",
              ),
              { ...normalizedData, createdAt: new Date().toISOString() },
            );
          }
        };

        const handleUpdateWork = async (wid, updates) => {
          const uid = requireAuthenticatedUser();
          if (!isSafeFirestoreId(wid)) throw new Error("INVALID_WORK_ID");
          const currentWork = works.find((w) => w.id === wid);
          const nextIsOwned =
            updates.isOwned !== undefined
              ? updates.isOwned
              : !!currentWork?.isOwned;
          const nextOwnedVolumes =
            updates.ownedVolumes !== undefined
              ? updates.ownedVolumes
              : currentWork?.ownedVolumes || [];
          const normalizedUpdates = {
            ...updates,
            ...((nextIsOwned || nextOwnedVolumes.length > 0)
              ? { isCart: false }
              : {}),
          };
          const db = window.FirebaseApp.getFirestore();
          const appId =
            typeof __app_id !== "undefined" ? __app_id : "default-app-id";
          await window.FirebaseApp.updateDoc(
            window.FirebaseApp.doc(
              db,
              "artifacts",
              appId,
              "users",
              uid,
              "works",
              wid,
            ),
            normalizedUpdates,
          );
        };

        const handleDeleteWork = async (wid) => {
          const uid = requireAuthenticatedUser();
          if (!isSafeFirestoreId(wid)) throw new Error("INVALID_WORK_ID");
          const db = window.FirebaseApp.getFirestore();
          const appId =
            typeof __app_id !== "undefined" ? __app_id : "default-app-id";
          await window.FirebaseApp.deleteDoc(
            window.FirebaseApp.doc(
              db,
              "artifacts",
              appId,
              "users",
              uid,
              "works",
              wid,
            ),
          );
        };

        const navToDetail = (id) => {
          setPreviousTab(currentTab);
          setSelectedWorkId(id);
          handleTabChange("detail");
        };

        const savePrefs = async (key, val, setter) => {
          const uid = requireAuthenticatedUser();
          const allowedKeys = new Set([
            "categories",
            "genres",
            "publishers",
            "customLists",
          ]);
          if (!allowedKeys.has(key)) throw new Error("INVALID_PREF_KEY");
          setter(val);
          const db = window.FirebaseApp.getFirestore();
          const appId =
            typeof __app_id !== "undefined" ? __app_id : "default-app-id";
          await window.FirebaseApp.setDoc(
            window.FirebaseApp.doc(
              db,
              "artifacts",
              appId,
              "users",
              uid,
              "settings",
              "prefs",
            ),
            { [key]: val },
            { merge: true },
          );
        };
        const resetAll = async () => setWorks([]);

        if (!isFirebaseLoaded || authLoading)
          return (
            <div className="h-screen flex items-center justify-center">
              <div className="spinner"></div>
            </div>
          );
        if (!window.isFirebaseInitialized || !window.FirebaseApp)
          return (
            <div className="min-h-screen flex items-center justify-center bg-background p-4">
              <div className="max-w-lg w-full bg-white rounded-3xl border border-red-100 shadow-soft p-8">
                <h1 className="text-xl font-bold text-red-600 mb-3">起動に失敗しました</h1>
                <p className="text-sm text-secondary leading-relaxed mb-4">
                  Firebase SDKを読み込めないか、Firebaseの初期化に失敗しています。
                </p>
                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs break-all space-y-2">
                  <p><span className="font-bold">公開ドメイン:</span> {window.location.hostname}</p>
                  <p>Firebaseの初期化に失敗しました。設定と通信状態を確認してください。</p>
                </div>
                <p className="text-xs text-secondary mt-4 leading-relaxed">
                  GitHub Pagesでログイン機能を使う場合は、Firebase Authentication の Authorized domains にこの公開ドメインを追加してください。
                </p>
              </div>
            </div>
          );
        if (!user)
          return (
            <AuthScreen
              onLogin={async (i, p) => {
                try {
                  await window.FirebaseApp.signInWithEmailAndPassword(
                    window.FirebaseApp.getAuth(),
                    `${i}@comilog.app`,
                    p,
                  );
                  setAuthError("");
                } catch (e) {
                  setAuthError(
                    e?.code === "auth/unauthorized-domain"
                      ? "この公開ドメインはFirebase Authenticationで許可されていません。"
                      : "ログインに失敗しました。IDまたはパスワードを確認してください。",
                  );
                }
              }}
              onSignup={async (i, p) => {
                try {
                  await window.FirebaseApp.createUserWithEmailAndPassword(
                    window.FirebaseApp.getAuth(),
                    `${i}@comilog.app`,
                    p,
                  );
                  setAuthError("");
                } catch (e) {
                  setAuthError(
                    e?.code === "auth/unauthorized-domain"
                      ? "この公開ドメインはFirebase Authenticationで許可されていません。"
                      : "登録に失敗しました。入力内容を確認して再度お試しください。",
                  );
                }
              }}
              error={authError}
              setError={setAuthError}
            />
          );

        const navs = [
          { id: "dashboard", l: "ホーム", i: <Icons.Home /> },
          { id: "bookshelf", l: "本棚", i: <Icons.Book /> },
          { id: "register", l: "登録", i: <Icons.Plus />, fab: true },
          { id: "cart", l: "カート", i: <Icons.Cart /> },
          { id: "ranking", l: "ランキング", i: <Icons.Trophy /> },
          { id: "settings", l: "設定", i: <Icons.Settings /> },
        ];

        return (
          <div className="min-h-screen bg-background pb-safe md:pb-0 md:pl-64">
            <div className="md:hidden fixed top-0 left-0 w-full bg-white/95 backdrop-blur-sm z-50 border-b border-borderLight px-4 py-3 flex justify-between items-center shadow-sm">
              <div
                className="flex items-center gap-2 font-black text-lg text-primary cursor-pointer"
                onClick={() => {
                  if (currentTab === "dashboard") {
                    window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
                  } else {
                    handleTabChange("dashboard");
                  }
                }}
              >
                <div className="w-7 h-7 bg-accent rounded-lg flex items-center justify-center shadow-sm">
                  <Icons.Pen className="w-3.5 h-3.5 text-white" />
                </div>
                コミログ
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => handleTabChange("settings")}
                  className={`p-2 rounded-full transition-colors ${currentTab === "settings" ? "bg-accent text-white shadow-md" : "bg-slate-100 text-secondary hover:bg-slate-200"}`}
                >
                  <Icons.Settings className="w-5 h-5" />
                </button>
              </div>
            </div>

            <nav className="fixed bottom-0 left-0 w-full glass z-50 shadow-soft md:top-0 md:w-64 md:h-screen md:bg-surface md:flex-col md:border-r border-borderLight pb-[env(safe-area-inset-bottom)] md:pb-0">
              <div className="hidden md:flex p-6 border-b border-borderLight items-center justify-between">
                <div
                  className="flex items-center cursor-pointer hover:opacity-80 transition-opacity"
                  onClick={() => {
                    if (currentTab === "dashboard") {
                      window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
                    } else {
                      handleTabChange("dashboard");
                    }
                  }}
                  onDoubleClick={() => {
                    handleTabChange("dashboard");
                    window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
                  }}
                >
                  <div className="w-8 h-8 bg-accent rounded-lg mr-3 flex items-center justify-center">
                    <Icons.Pen className="w-4 h-4 text-white" />
                  </div>
                  <h1 className="font-black text-xl select-none">コミログ</h1>
                </div>
              </div>
              <div className="grid grid-cols-5 md:flex md:flex-col p-2 md:p-6 gap-1 md:gap-3 items-center md:justify-start w-full h-[72px] md:h-auto relative">
                {navs.map((n) => (
                  <button
                    key={n.id}
                    onClick={() => {
                      if (n.id === "register") setEditingWorkId(null);
                      if (currentTab === n.id) {
                        window.scrollTo({
                          top: 0,
                          left: 0,
                          behavior: "smooth",
                        });
                      } else {
                        handleTabChange(n.id);
                      }
                    }}
                    className={`flex flex-col md:flex-row items-center justify-center w-full h-[56px] md:h-auto md:w-full shrink-0 md:py-3 md:px-5 md:rounded-xl md:justify-start md:my-0.5 relative transition-colors ${currentTab === n.id && !n.fab ? "text-accent md:bg-accentLight font-bold" : "text-secondary hover:text-primary md:hover:bg-slate-50"} ${n.id === "settings" ? "hidden md:flex" : ""}`}
                  >
                    {n.fab && (
                      <div className="md:hidden absolute -top-7 left-1/2 -translate-x-1/2 w-12 h-12 rounded-full bg-accent text-white flex items-center justify-center shadow-lg border-4 border-background">
                        <Icons.Plus className="w-6 h-6" />
                      </div>
                    )}
                    <div className={`flex items-center justify-center w-6 h-6 md:w-5 md:h-5 md:mr-3 shrink-0 mb-1 md:mb-0 relative ${n.fab ? "opacity-0 md:opacity-100" : ""}`}>
                      {n.i}
                    </div>
                    <span
                      className={`text-[10px] md:text-sm whitespace-nowrap ${n.fab ? "mt-1 md:mt-0" : ""} ${currentTab === n.id && !n.fab ? "font-bold text-accent" : "font-medium"}`}
                    >
                      {n.l}
                    </span>
                  </button>
                ))}
              </div>
            </nav>
            <main className="max-w-5xl mx-auto p-4 md:p-8 pt-[72px] md:pt-8 relative">
              {currentTab === "dashboard" && (
                <Dashboard
                  works={works}
                  customLists={customLists}
                  onNavigateToBookshelf={(t) => {
                    setBookshelfTab(t);
                    handleTabChange("bookshelf");
                  }}
                  onNavigateToCart={() => handleTabChange("cart")}
                  onViewDetail={navToDetail}
                  dict={dict}
                />
              )}

              {/* 本棚（一覧画面）: 状態を維持するために display で表示/非表示を切り替え */}
              <div
                style={{
                  display: currentTab === "bookshelf" ? "block" : "none",
                }}
              >
                <Bookshelf
                  works={works}
                  listTab={bookshelfTab}
                  onTabChange={setBookshelfTab}
                  onEdit={(id) => {
                    setEditingWorkId(id);
                    handleTabChange("register");
                  }}
                  onDelete={handleDeleteWork}
                  onUpdateWork={handleUpdateWork}
                  genres={genres}
                  onViewDetail={navToDetail}
                  customLists={customLists}
                  onSaveLists={(lists) =>
                    savePrefs("customLists", lists, setCustomLists)
                  }
                  dict={dict}
                />
              </div>

              {/* カート */}
              {currentTab === "cart" && (
                <Bookshelf
                  works={works}
                  listTab="cart"
                  onTabChange={() => {}}
                  onEdit={(id) => {
                    setEditingWorkId(id);
                    handleTabChange("register");
                  }}
                  onDelete={handleDeleteWork}
                  onUpdateWork={handleUpdateWork}
                  genres={genres}
                  onViewDetail={navToDetail}
                  customLists={customLists}
                  onSaveLists={() => {}}
                  dict={dict}
                  hideTabs={true}
                />
              )}

              {/* 詳細画面 */}
              {currentTab === "detail" && (
                <WorkDetail
                  workId={selectedWorkId}
                  works={works}
                  onBack={() => handleTabChange(previousTab)}
                  onEdit={(id) => {
                    setEditingWorkId(id);
                    handleTabChange("register");
                  }}
                  onDelete={handleDeleteWork}
                  dict={dict}
                />
              )}

              {/* 登録・編集画面 */}
              {currentTab === "register" && (
                <WorkForm
                  works={works}
                  initialData={
                    editingWorkId
                      ? works.find((w) => w.id === editingWorkId)
                      : null
                  }
                  workId={editingWorkId}
                  draftRef={workFormDraftRef}
                  onSave={handleSaveWork}
                  onCancel={() => handleTabChange(previousTab || "bookshelf")}
                  categories={categories}
                  genres={genres}
                  publishers={publishers}
                  onAddPublisher={(p) =>
                    savePrefs("publishers", [...publishers, p], setPublishers)
                  }
                  onAddCategory={(c) =>
                    savePrefs("categories", [...categories, c], setCategories)
                  }
                  onAddGenre={(g) =>
                    savePrefs("genres", [...genres, g], setGenres)
                  }
                  dict={dict}
                />
              )}

              {/* ランキング画面 */}
              <div
                style={{ display: currentTab === "ranking" ? "block" : "none" }}
              >
                <RankingPortal
                  works={works}
                  dict={dict}
                  onViewDetail={navToDetail}
                />
              </div>

              {/* 設定画面 */}
              {currentTab === "settings" && (
                <SettingsPortal
                  works={works}
                  categories={categories}
                  setCategories={(c) =>
                    savePrefs("categories", c, setCategories)
                  }
                  genres={genres}
                  setGenres={(g) => savePrefs("genres", g, setGenres)}
                  publishers={publishers}
                  setPublishers={(p) =>
                    savePrefs("publishers", p, setPublishers)
                  }
                  resetAll={resetAll}
                  onLogout={() =>
                    window.FirebaseApp.signOut(window.FirebaseApp.getAuth())
                  }
                  dict={dict}
                />
              )}
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
